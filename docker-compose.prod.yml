# =============================================================================
# SYNCLEDGER - PRODUCTION DOCKER COMPOSE
# Alias for docker-compose.deploy.yml — both use RDS, S3, GHCR images
# This file is kept for backward compatibility
# Preferred: docker-compose.deploy.yml
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Spring Boot Backend API
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/${GHCR_OWNER:-vedvix}/syncledger-backend:${IMAGE_TAG:-latest}
    container_name: syncledger-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-syncledger}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-syncledger}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      STORAGE_TYPE: s3
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-syncledger-prod-invoices}
      PDF_SERVICE_URL: http://pdf-service:8001
      EMAIL_POLLING_ENABLED: ${EMAIL_POLLING_ENABLED:-false}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      SERVER_SERVLET_CONTEXT_PATH: /
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - syncledger
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Python PDF Microservice
  # ---------------------------------------------------------------------------
  pdf-service:
    image: ghcr.io/${GHCR_OWNER:-vedvix}/syncledger-pdf:${IMAGE_TAG:-latest}
    container_name: syncledger-pdf
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-syncledger}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-syncledger}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o}
    volumes:
      - pdf_temp:/tmp/pdf_processing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - syncledger
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  uploads_data:
    driver: local
  pdf_temp:
    driver: local

networks:
  syncledger:
    driver: bridge
