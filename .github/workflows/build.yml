# =============================================================================
# SYNCLEDGER - BUILD & PUSH DOCKER IMAGES
# Triggered on push to main/develop/release/* or manual dispatch
# Tags images with branch name for environment-based deployments
# =============================================================================

name: Build & Push Images

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'frontend/**'
      - 'syncledger-backend/**'
      - 'pdf-microservice/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: frontend,backend,pdf or all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ---- Detect changes ----
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.resolve.outputs.frontend }}
      backend: ${{ steps.resolve.outputs.backend }}
      pdf: ${{ steps.resolve.outputs.pdf }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'syncledger-backend/**'
            pdf:
              - 'pdf-microservice/**'
            workflow:
              - '.github/workflows/build.yml'

      - name: Resolve services to build
        id: resolve
        shell: bash
        run: |
          FE=false
          BE=false
          PDF=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_RAW="${{ github.event.inputs.services }}"
            INPUT=$(echo "${INPUT_RAW:-all}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

            if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
              FE=true
              BE=true
              PDF=true
            else
              case ",$INPUT," in *",frontend,"*) FE=true ;; esac
              case ",$INPUT," in *",backend,"*) BE=true ;; esac
              case ",$INPUT," in *",pdf,"*) PDF=true ;; esac

              if [ "$FE" != "true" ] && [ "$BE" != "true" ] && [ "$PDF" != "true" ]; then
                echo "::error::Invalid services input '$INPUT_RAW'. Use: all or comma-separated frontend,backend,pdf"
                exit 1
              fi
            fi
          else
            FE="${{ steps.filter.outputs.frontend }}"
            BE="${{ steps.filter.outputs.backend }}"
            PDF="${{ steps.filter.outputs.pdf }}"

            # If the workflow changed, rebuild all images to validate CI changes.
            if [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
              FE=true
              BE=true
              PDF=true
            fi
          fi

          echo "frontend=$FE" >> "$GITHUB_OUTPUT"
          echo "backend=$BE" >> "$GITHUB_OUTPUT"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
          echo "Resolved build flags -> frontend=$FE backend=$BE pdf=$PDF"

      - name: Compute branch tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # Sanitize branch name for Docker tag (replace / with -)
          BRANCH_TAG=$(echo "$BRANCH" | sed 's|/|-|g')
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "image_prefix=$OWNER_LC" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH -> Tag prefix: $BRANCH_TAG"

  # ---- Build Frontend ----
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-frontend:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-frontend:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build Backend ----
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./syncledger-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-backend:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-backend:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build PDF Service ----
  build-pdf:
    name: Build PDF Service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pdf == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./pdf-microservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-pdf:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-pdf:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.image_prefix }}/syncledger-pdf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Create Git Tag ----
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-pdf]
    if: always() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SAFE=$(echo "$BRANCH" | sed 's|/|-|g')
          TAG="${BRANCH_SAFE}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"
