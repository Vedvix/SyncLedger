# =============================================================================
# SYNCLEDGER - BUILD & PUSH DOCKER IMAGES
# Triggered on push to main/develop/release/* or manual dispatch
# Tags images with branch name for environment-based deployments
# =============================================================================

name: Build & Push Images

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'frontend/**'
      - 'syncledger-backend/**'
      - 'pdf-microservice/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated: frontend,backend,pdf or all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ---- Detect changes ----
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      pdf: ${{ steps.filter.outputs.pdf }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'syncledger-backend/**'
            pdf:
              - 'pdf-microservice/**'

      - name: Compute branch tag
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # Sanitize branch name for Docker tag (replace / with -)
          BRANCH_TAG=$(echo "$BRANCH" | sed 's|/|-|g')
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH -> Tag prefix: $BRANCH_TAG"

  # ---- Build Frontend ----
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-frontend:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-frontend:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build Backend ----
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./syncledger-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-backend:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-backend:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build PDF Service ----
  build-pdf:
    name: Build PDF Service
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.pdf == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./pdf-microservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-pdf:${{ needs.changes.outputs.branch_tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-pdf:${{ needs.changes.outputs.branch_tag }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/syncledger-pdf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Create Git Tag ----
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-pdf]
    if: always() && !contains(needs.*.result, 'failure')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SAFE=$(echo "$BRANCH" | sed 's|/|-|g')
          TAG="${BRANCH_SAFE}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag: $TAG"
