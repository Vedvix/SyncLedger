# =============================================================================
# SYNCLEDGER - DEPLOY INFRASTRUCTURE & APPLICATION
# Branch mapping: main->prod, develop->dev, release/*->staging
# Terraform provisions AWS resources; SSM deploys containers to EC2.
# Prod uses ALB + ASG (instance refresh); dev/staging use single EC2.
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Branch to deploy (auto-maps to environment)'
        required: true
        type: string
        default: 'main'
      image_tag:
        description: 'Docker image tag to deploy (default: branch-latest)'
        required: false
        type: string
        default: ''
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - plan-only
      update_secrets:
        description: 'Update GHCR credentials in Secrets Manager'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DEPLOY_WORKFLOW_VERSION: '2026-03-11-ssm-fix-v3'

permissions:
  contents: read
  packages: read
  id-token: write

# Only one deploy per environment at a time
concurrency:
  group: deploy-${{ inputs.deploy_branch }}
  cancel-in-progress: false

jobs:
  # ---- Resolve environment from branch ----
  resolve:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      branch_tag: ${{ steps.env.outputs.branch_tag }}
      ghcr_owner: ${{ steps.env.outputs.ghcr_owner }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          BRANCH="${{ inputs.deploy_branch }}"
          
          if [[ "$BRANCH" == "main" ]]; then
            ENV="prod"
          elif [[ "$BRANCH" == release/* ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          
          BRANCH_TAG=$(echo "$BRANCH" | sed 's|/|-|g')
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${BRANCH_TAG}-latest"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "branch_tag=$BRANCH_TAG" >> $GITHUB_OUTPUT
          echo "ghcr_owner=$GHCR_OWNER" >> $GITHUB_OUTPUT
          
          echo "========================================"
          echo "  Workflow:    ${{ env.DEPLOY_WORKFLOW_VERSION }}"
          echo "  Branch:      $BRANCH"
          echo "  Environment: $ENV"
          echo "  Image Tag:   $IMAGE_TAG"
          echo "========================================"

  # ---- Terraform Plan + Apply ----
  terraform:
    name: Terraform (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.environment }}
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      instance_ip: ${{ steps.outputs.outputs.instance_ip }}
      rds_endpoint: ${{ steps.outputs.outputs.rds_endpoint }}
      s3_bucket: ${{ steps.outputs.outputs.s3_bucket }}
      asg_name: ${{ steps.outputs.outputs.asg_name }}
    env:
      TF_VAR_environment: ${{ needs.resolve.outputs.environment }}
      TF_VAR_image_tag: ${{ needs.resolve.outputs.image_tag }}
      TF_VAR_ghcr_owner: ${{ needs.resolve.outputs.ghcr_owner }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_ec2_key_name: ${{ vars.EC2_KEY_NAME || '' }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || '' }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID || '' }}
      TF_VAR_s3_config_bucket: ${{ vars.S3_CONFIG_BUCKET || 'syncledger-config' }}
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID || '' }}
      TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET || '' }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          STATE_BUCKET="${{ vars.TF_STATE_BUCKET || 'syncledger-terraform-state' }}"
          LOCK_TABLE="${{ vars.TF_LOCK_TABLE || 'syncledger-terraform-locks' }}"

          INIT_ARGS=(
            "-backend-config=bucket=${STATE_BUCKET}"
            "-backend-config=key=syncledger/${ENV}/terraform.tfstate"
            "-backend-config=region=${{ env.AWS_REGION }}"
            "-backend-config=encrypt=true"
          )

          # Add DynamoDB locking only when the table exists and is accessible.
          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "DynamoDB lock table detected: $LOCK_TABLE — locking enabled."
            INIT_ARGS+=("-backend-config=dynamodb_table=${LOCK_TABLE}")
          else
            echo "DynamoDB lock table '$LOCK_TABLE' not available — proceeding without state locking."
          fi

          terraform init "${INIT_ARGS[@]}"

      - name: Terraform Plan
        working-directory: infra
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          terraform plan \
            -var-file="environments/${ENV}.tfvars" \
            -input=false \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'deploy'
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        if: inputs.action == 'deploy'
        id: outputs
        working-directory: infra
        run: |
          echo "instance_id=$(terraform output -raw ec2_instance_id)" >> $GITHUB_OUTPUT
          echo "instance_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_storage_bucket)" >> $GITHUB_OUTPUT
          echo "asg_name=$(terraform output -raw asg_name)" >> $GITHUB_OUTPUT

  # ---- Update secrets and deploy ----
  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [resolve, terraform]
    if: inputs.action == 'deploy'
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload docker-compose.deploy.yml to S3 config bucket
      - name: Upload docker-compose to S3
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          aws s3 cp docker-compose.deploy.yml \
            "s3://${{ vars.S3_CONFIG_BUCKET || 'syncledger-config' }}/${ENV}/docker-compose.yml"

      # Update GHCR credentials in Secrets Manager
      - name: Update GHCR credentials
        if: inputs.update_secrets
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          aws secretsmanager put-secret-value \
            --secret-id "syncledger/${ENV}/ghcr" \
            --secret-string "{\"username\":\"${{ github.actor }}\",\"token\":\"${{ secrets.GHCR_PAT }}\"}" \
            --region ${{ env.AWS_REGION }} || \
          aws secretsmanager create-secret \
            --name "syncledger/${ENV}/ghcr" \
            --secret-string "{\"username\":\"${{ github.actor }}\",\"token\":\"${{ secrets.GHCR_PAT }}\"}" \
            --region ${{ env.AWS_REGION }}

      # Deploy via SSM Run Command
      - name: Deploy via SSM
        run: |
          INSTANCE_ID="${{ needs.terraform.outputs.instance_id }}"
          ENV="${{ needs.resolve.outputs.environment }}"
          IMAGE_TAG="${{ needs.resolve.outputs.image_tag }}"
          OWNER="${{ needs.resolve.outputs.ghcr_owner }}"
          CONFIG_BUCKET="${{ vars.S3_CONFIG_BUCKET || 'syncledger-config' }}"
          ASG_NAME="${{ needs.terraform.outputs.asg_name }}"
          
          DEPLOY_SCRIPT=$(cat <<'EOF'
          set -eu
          # Bootstrap target directory for first-time deployments.
          if [ ! -d /opt/syncledger ]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo mkdir -p /opt/syncledger
              sudo chown "$USER":"$USER" /opt/syncledger || true
            else
              mkdir -p /opt/syncledger
              chown "$USER":"$USER" /opt/syncledger || true
            fi
          fi
          cd /opt/syncledger
          
          # Download latest docker-compose from S3
          aws s3 cp "s3://CONFIGBUCKET/ENVNAME/docker-compose.yml" docker-compose.yml --region AWSREGION
          
          # Load secrets and regenerate .env (idempotent, doesn't rely on bootstrap)
          APP_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "syncledger/ENVNAME/app-config" \
            --region AWSREGION \
            --query 'SecretString' --output text)
          
          cat > .env <<ENVEOF
          DB_HOST=$(echo "$APP_SECRET" | jq -r '.DB_HOST')
          DB_PORT=$(echo "$APP_SECRET" | jq -r '.DB_PORT // "5432"')
          DB_NAME=$(echo "$APP_SECRET" | jq -r '.DB_NAME // "syncledger"')
          DB_USERNAME=$(echo "$APP_SECRET" | jq -r '.DB_USERNAME')
          DB_PASSWORD=$(echo "$APP_SECRET" | jq -r '.DB_PASSWORD')
          JWT_SECRET=$(echo "$APP_SECRET" | jq -r '.JWT_SECRET')
          ENVIRONMENT=ENVNAME
          SPRING_PROFILES_ACTIVE=docker
          STORAGE_TYPE=s3
          AWS_REGION=AWSREGION
          S3_BUCKET_NAME=$(echo "$APP_SECRET" | jq -r '.S3_BUCKET_NAME')
          OPENAI_API_KEY=$(echo "$APP_SECRET" | jq -r '.OPENAI_API_KEY')
          OPENAI_VISION_MODEL=gpt-4o
          OPENAI_TEXT_MODEL=gpt-4o
          GHCR_OWNER=GHCROWNER
          IMAGE_TAG=IMAGETAG
          EMAIL_POLLING_ENABLED=$(echo "$APP_SECRET" | jq -r '.EMAIL_POLLING_ENABLED // "false"')
          AZURE_CLIENT_ID=$(echo "$APP_SECRET" | jq -r '.AZURE_CLIENT_ID // ""')
          AZURE_CLIENT_SECRET=$(echo "$APP_SECRET" | jq -r '.AZURE_CLIENT_SECRET // ""')
          AZURE_TENANT_ID=$(echo "$APP_SECRET" | jq -r '.AZURE_TENANT_ID // ""')
          CORS_ALLOWED_ORIGINS=$(echo "$APP_SECRET" | jq -r '.CORS_ALLOWED_ORIGINS // "http://localhost"')
          ENVEOF
          chmod 600 .env
          
          # Re-login to GHCR
          GHCR_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "syncledger/ENVNAME/ghcr" \
            --region AWSREGION \
            --query 'SecretString' --output text 2>/dev/null || echo '{}')
          GHCR_TOKEN=$(echo "$GHCR_SECRET" | jq -r '.token // empty')
          GHCR_USER=$(echo "$GHCR_SECRET" | jq -r '.username // empty')
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          
          # Pull and deploy
          docker image prune -af --filter "until=24h" || true
          docker container prune -f || true
          export COMPOSE_HTTP_TIMEOUT=600
          docker-compose pull
          docker-compose up -d --remove-orphans
          docker image prune -af --filter "until=72h"
          
          echo "Deployment complete! Image tag: IMAGETAG"
          EOF
          )
          
          # Replace placeholders
          DEPLOY_SCRIPT=$(echo "$DEPLOY_SCRIPT" | sed "s|CONFIGBUCKET|$CONFIG_BUCKET|g")
          DEPLOY_SCRIPT=$(echo "$DEPLOY_SCRIPT" | sed "s|ENVNAME|$ENV|g")
          DEPLOY_SCRIPT=$(echo "$DEPLOY_SCRIPT" | sed "s|AWSREGION|${{ env.AWS_REGION }}|g")
          DEPLOY_SCRIPT=$(echo "$DEPLOY_SCRIPT" | sed "s|IMAGETAG|$IMAGE_TAG|g")
          DEPLOY_SCRIPT=$(echo "$DEPLOY_SCRIPT" | sed "s|GHCROWNER|$OWNER|g")
          
          # Base64 encode script to safely pass through SSM JSON without newline mangling
          DEPLOY_SCRIPT_B64=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)
          
          # ----- Prod: deploy to all ASG instances -----
          if [ "$ENV" = "prod" ]; then
            echo "Production environment — discovering ASG instances..."
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text)
            
            if [ -z "$INSTANCE_IDS" ]; then
              echo "No InService instances in ASG. Triggering instance refresh..."
              aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$ASG_NAME" \
                --region ${{ env.AWS_REGION }} \
                --preferences '{"MinHealthyPercentage": 50}'
              echo "Instance refresh started — new instances will bootstrap from user_data."
              exit 0
            fi
            
            echo "Found ASG instances: $INSTANCE_IDS"
            
            # SSM send-command supports multiple instance IDs
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids $INSTANCE_IDS \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"echo $DEPLOY_SCRIPT_B64 | base64 -d | bash\"]" \
              --timeout-seconds 1800 \
              --region ${{ env.AWS_REGION }} \
              --output text \
              --query "Command.CommandId" 2>/dev/null || echo "")
            
            if [ -z "$COMMAND_ID" ]; then
              echo "SSM not available. Instances may still be initializing."
              echo "Triggering ASG instance refresh as fallback..."
              aws autoscaling start-instance-refresh \
                --auto-scaling-group-name "$ASG_NAME" \
                --region ${{ env.AWS_REGION }} \
                --preferences '{"MinHealthyPercentage": 50}'
              exit 0
            fi
            
            echo "Waiting for deployment across ASG instances (command: $COMMAND_ID)..."
            sleep 10
            
            # Poll each instance for completion
            DEPLOY_SUCCESS=true
            for IID in $INSTANCE_IDS; do
              echo "--- Checking instance $IID ---"
              LAST_STATUS="Pending"
              for i in $(seq 1 180); do
                STATUS=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$IID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'Status' --output text 2>/dev/null || echo "Pending")
                LAST_STATUS="$STATUS"
                
                if [ "$STATUS" = "Success" ]; then
                  echo "Instance $IID: deployment successful!"
                  break
                elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
                  echo "Instance $IID: deployment FAILED!"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$IID" \
                    --region ${{ env.AWS_REGION }} \
                    --query 'StandardErrorContent' --output text || true
                  DEPLOY_SUCCESS=false
                  break
                fi
                echo "  Instance $IID: $STATUS (attempt $i/180)..."
                sleep 10
              done
              
              if [ "$LAST_STATUS" != "Success" ] && [ "$LAST_STATUS" != "Failed" ] && [ "$LAST_STATUS" != "Cancelled" ]; then
                echo "Instance $IID: timed out (status: $LAST_STATUS)"
                DEPLOY_SUCCESS=false
              fi
            done
            
            if [ "$DEPLOY_SUCCESS" != "true" ]; then
              echo "One or more instances failed deployment."
              exit 1
            fi
          else
            # ----- Dev/Staging: single instance SSM -----
            echo "Deploying to instance $INSTANCE_ID..."
            
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[\"echo $DEPLOY_SCRIPT_B64 | base64 -d | bash\"]" \
              --timeout-seconds 1800 \
              --region ${{ env.AWS_REGION }} \
              --output text \
              --query "Command.CommandId" 2>/dev/null || echo "")
            
            if [ -z "$COMMAND_ID" ]; then
              echo "SSM not available yet. The instance may still be initializing."
              echo "SSH into ${{ needs.terraform.outputs.instance_ip }} to deploy manually."
              exit 0
            fi
            
            echo "Waiting for deployment (command: $COMMAND_ID)..."
            sleep 10
            
            LAST_STATUS="Pending"
            for i in $(seq 1 180); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              LAST_STATUS="$STATUS"
              
              if [ "$STATUS" = "Success" ]; then
                echo "Deployment successful!"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'StandardOutputContent' --output text
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "Deployment failed!"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'StandardErrorContent' --output text
                exit 1
              fi
              echo "  Status: $STATUS (attempt $i/180)..."
              sleep 10
            done

            if [ "$LAST_STATUS" != "Success" ]; then
              echo "Deployment command did not complete successfully (final status: $LAST_STATUS)."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' --output text || true
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardErrorContent' --output text || true
              exit 1
            fi
          fi

      # Health check
      - name: Health Check
        run: |
          IP="${{ needs.terraform.outputs.instance_ip }}"
          echo "Checking health at http://$IP/api/actuator/health ..."
          HEALTHY=false
          
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP/api/actuator/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Application is healthy!"
              HEALTHY=true
              break
            fi
            echo "  Attempt $i/20 - HTTP $HTTP_CODE, retrying in 15s..."
            sleep 15
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "Health check failed: application is not reachable on /api/actuator/health"
            exit 1
          fi

      - name: Collect Runtime Diagnostics
        if: failure()
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          DIAG_CMD='set -e; cd /opt/syncledger; echo "=== docker ps ==="; docker ps -a; echo "=== compose ps ==="; docker-compose ps; echo "=== last 120 lines of compose logs ==="; docker-compose logs --tail=120 || true; echo "=== port listeners ==="; ss -lntp | grep -E ":80|:8080|:8001" || true'

          if [ "$ENV" = "prod" ]; then
            ASG_NAME="${{ needs.terraform.outputs.asg_name }}"
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --region ${{ env.AWS_REGION }} \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$INSTANCE_IDS" ]; then
              echo "No InService ASG instances found for diagnostics."
              exit 0
            fi
            
            for IID in $INSTANCE_IDS; do
              echo ""
              echo "======== Diagnostics for $IID ========"
              CMD_ID=$(aws ssm send-command \
                --instance-ids "$IID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[$(printf '%s' "$DIAG_CMD" | jq -Rs .)]" \
                --region ${{ env.AWS_REGION }} \
                --query 'Command.CommandId' --output text 2>/dev/null || echo "")
              
              if [ -n "$CMD_ID" ]; then
                sleep 8
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$IID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'StandardOutputContent' --output text || true
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$IID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'StandardErrorContent' --output text || true
              else
                echo "SSM not available for instance $IID"
              fi
            done
          else
            INSTANCE_ID="${{ needs.terraform.outputs.instance_id }}"
            echo "Collecting runtime diagnostics from $INSTANCE_ID..."
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[$(printf '%s' "$DIAG_CMD" | jq -Rs .)]" \
              --region ${{ env.AWS_REGION }} \
              --query 'Command.CommandId' --output text)

            sleep 8
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'StandardOutputContent' --output text || true
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'StandardErrorContent' --output text || true
          fi

      - name: Deployment Summary
        if: always()
        run: |
          ENV="${{ needs.resolve.outputs.environment }}"
          echo ""
          echo "========================================"
          echo "  DEPLOYMENT SUMMARY"
          echo "========================================"
          echo "  Workflow:    ${{ env.DEPLOY_WORKFLOW_VERSION }}"
          echo "  Environment:  $ENV"
          echo "  Branch:       ${{ inputs.deploy_branch }}"
          echo "  Image Tag:    ${{ needs.resolve.outputs.image_tag }}"
          if [ "$ENV" = "prod" ]; then
            echo "  ASG Name:     ${{ needs.terraform.outputs.asg_name }}"
            echo "  ALB DNS:      ${{ needs.terraform.outputs.instance_ip }}"
          else
            echo "  Instance:     ${{ needs.terraform.outputs.instance_id }}"
            echo "  Public IP:    ${{ needs.terraform.outputs.instance_ip }}"
          fi
          echo "  RDS:          ${{ needs.terraform.outputs.rds_endpoint }}"
          echo "  S3 Bucket:    ${{ needs.terraform.outputs.s3_bucket }}"
          echo "  App URL:      http://${{ needs.terraform.outputs.instance_ip }}"
          echo "  API URL:      http://${{ needs.terraform.outputs.instance_ip }}/api"
          echo "========================================"
