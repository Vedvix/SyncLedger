# =============================================================================
# SYNCLEDGER - DESTROY INFRASTRUCTURE
# Tears down all AWS resources for a specific environment
# Requires typing "DESTROY" to confirm
# =============================================================================

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: 'Type "DESTROY" to confirm destruction of all resources'
        required: true
        type: string

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---- Validate ----
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed! You must type 'DESTROY' to proceed."
            exit 1
          fi
          echo "Confirmation received. Proceeding with destruction of ${{ inputs.environment }}..."

  # ---- Destroy ----
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate
    environment: destroy-${{ inputs.environment }}
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_s3_config_bucket: ${{ vars.S3_CONFIG_BUCKET || 'syncledger-config' }}
      TF_VAR_ec2_key_name: ${{ vars.EC2_KEY_NAME || '' }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Ensure Terraform Lock Table Exists
        run: |
          LOCK_TABLE="${{ vars.TF_LOCK_TABLE || 'syncledger-terraform-locks' }}"
          echo "Checking Terraform lock table: ${LOCK_TABLE}"

          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Lock table already exists."
          else
            echo "Lock table not found. Creating ${LOCK_TABLE}..."
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"

            aws dynamodb wait table-exists \
              --table-name "$LOCK_TABLE" \
              --region "${{ env.AWS_REGION }}"

            echo "Lock table created."
          fi

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'syncledger-terraform-state' }}" \
            -backend-config="key=syncledger/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'syncledger-terraform-locks' }}" \
            -backend-config="encrypt=true"

      - name: Stop containers
        continue-on-error: true
        run: |
          INSTANCE_ID=$(cd infra && terraform output -raw ec2_instance_id 2>/dev/null || echo "")
          if [ -n "$INSTANCE_ID" ]; then
            echo "Stopping containers on $INSTANCE_ID..."
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/syncledger && docker-compose down -v 2>/dev/null || true"]' \
              --timeout-seconds 60 \
              --region ${{ env.AWS_REGION }} || true
            sleep 15
          fi

      - name: Terraform Destroy
        working-directory: infra
        run: |
          terraform destroy \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -auto-approve \
            -input=false

      - name: Cleanup Secrets Manager
        continue-on-error: true
        run: |
          ENV="${{ inputs.environment }}"
          for SECRET in "syncledger/${ENV}/app-config" "syncledger/${ENV}/ghcr"; do
            aws secretsmanager delete-secret \
              --secret-id "$SECRET" \
              --force-delete-without-recovery \
              --region ${{ env.AWS_REGION }} 2>/dev/null || true
          done

      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "  ALL RESOURCES DESTROYED"
          echo "========================================"
          echo "  Environment:  ${{ inputs.environment }}"
          echo "  Destroyed:    $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "  Resources removed:"
          echo "    - EC2 Instance + EIP"
          echo "    - RDS PostgreSQL"
          echo "    - S3 Storage Bucket"
          echo "    - Security Groups"
          echo "    - VPC + Subnets"
          echo "    - IAM Role + Instance Profile"
          echo "    - CloudWatch Log Group"
          echo "    - Secrets Manager entries"
          echo "========================================"
