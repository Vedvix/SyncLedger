# =============================================================================
# SYNCLEDGER - DEPLOYMENT DOCKER COMPOSE
# Runs on EC2, connects to external RDS PostgreSQL
# Images pulled from GitHub Container Registry (GHCR)
# No local database - all data in managed RDS
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Spring Boot Backend API
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/${GHCR_OWNER:-vedvix}/syncledger-backend:${IMAGE_TAG:-latest}
    container_name: syncledger-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # RDS connection (external managed database)
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-syncledger}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-syncledger}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      # Application
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      STORAGE_TYPE: s3
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      PDF_SERVICE_URL: http://pdf-service:8001
      # Email
      EMAIL_POLLING_ENABLED: ${EMAIL_POLLING_ENABLED:-false}
      EMAIL_POLLING_INTERVAL_MS: ${EMAIL_POLLING_INTERVAL_MS:-300000}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Encryption key for secrets at rest
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      # Backend-only mode (no frontend reverse proxy)
      SERVER_SERVLET_CONTEXT_PATH: /
      # Organization Seed - LongHome
      SEED_LONGHOME_ENABLED: ${SEED_LONGHOME_ENABLED:-true}
      SEED_LONGHOME_MS_CLIENT_ID: ${SEED_LONGHOME_MS_CLIENT_ID:-}
      SEED_LONGHOME_MS_TENANT_ID: ${SEED_LONGHOME_MS_TENANT_ID:-}
      SEED_LONGHOME_MS_CLIENT_SECRET: ${SEED_LONGHOME_MS_CLIENT_SECRET:-}
      SEED_LONGHOME_MS_MAILBOX: ${SEED_LONGHOME_MS_MAILBOX:-admin@evolotek.ai}
      SEED_LONGHOME_ERP_COMPANY_ID: ${SEED_LONGHOME_ERP_COMPANY_ID:-}
      SEED_LONGHOME_ERP_USER_ID: ${SEED_LONGHOME_ERP_USER_ID:-}
      SEED_LONGHOME_ERP_PASSWORD: ${SEED_LONGHOME_ERP_PASSWORD:-}
      SEED_LONGHOME_OBJECT_ID: ${SEED_LONGHOME_OBJECT_ID:-}
      SEED_LONGHOME_CERT_SECRET_ID: ${SEED_LONGHOME_CERT_SECRET_ID:-}
      SEED_LONGHOME_ADMIN_PASSWORD: ${SEED_LONGHOME_ADMIN_PASSWORD:-LongHome@2026!}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - syncledger
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Python PDF Microservice
  # ---------------------------------------------------------------------------
  pdf-service:
    image: ghcr.io/${GHCR_OWNER:-vedvix}/syncledger-pdf:${IMAGE_TAG:-latest}
    container_name: syncledger-pdf
    restart: always
    environment:
      # RDS connection (external managed database)
      DATABASE_URL: postgresql://${DB_USERNAME:-syncledger}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-syncledger}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o}
    volumes:
      - pdf_temp:/tmp/pdf_processing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - syncledger
    deploy:
      resources:
        limits:
          memory: 256M


volumes:
  uploads_data:
    driver: local
  pdf_temp:
    driver: local

networks:
  syncledger:
    driver: bridge
